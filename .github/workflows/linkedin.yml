name: LinkedIn Manual Chunked Post

on:
  workflow_dispatch:
    inputs:
      lines_per_post:
        description: 'Number of lines per post (Default: 6)'
        required: true
        default: '6'

jobs:
  post-to-linkedin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Chunk File and Post to LinkedIn
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINES_PER_POST: ${{ github.event.inputs.lines_per_post }}
        run: |
          if [ ! -f "post.txt" ]; then
            echo "Error: post.txt does not exist!"
            exit 1
          fi

          TOKEN=$(echo "$LINKEDIN_TOKEN" | tr -d '\r\n ')

          # Ensure AUTHOR_URN includes the full urn:li:person: prefix
          if [[ "$AUTHOR_URN" != urn:* ]]; then
            AUTHOR_URN="urn:li:person:$AUTHOR_URN"
          fi

          # 1. Split post.txt into chunk files (chunk_aa, chunk_ab, etc.)
          split -l "$LINES_PER_POST" post.txt chunk_

          # 2. Process each chunk file sequentially
          for file in chunk_*; do
            [ -e "$file" ] || continue

            # Combine lines with double newlines between entries
            POST_CONTENT=$(awk 'NR>1{print ""}1' "$file")

            echo "====================================="
            echo "Submitting Chunk to LinkedIn:"
            echo "$POST_CONTENT"
            echo "====================================="

            # Build safe JSON payload using jq
            PAYLOAD=$(jq -n \
              --arg author "$AUTHOR_URN" \
              --arg commentary "$POST_CONTENT" \
              '{
                author: $author,
                commentary: $commentary,
                visibility: "PUBLIC",
                distribution: {
                  feedDistribution: "MAIN_FEED",
                  targetEntities: [],
                  thirdPartyDistributionChannels: []
                },
                lifecycleState: "PUBLISHED"
              }')

            # Execute API Request
            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.linkedin.com/rest/posts" \
              -H "Authorization: Bearer $TOKEN" \
              -H "LinkedIn-Version: 202603" \
              -H "X-Restli-Protocol-Version: 2.0.0" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
            RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')

            echo "HTTP Status Code: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ne 201 ]; then
              echo "Failed response: $RESPONSE_BODY"
            else
              echo "Post successfully published."
            fi

            # Clean up temporary chunk file and pause between requests
            rm "$file"
            sleep 5
          done
