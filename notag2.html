  // Converts sed commands into executable JS regex rules
    function compileSedRules(rawRules) {
        return rawRules
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(line => line.length > 0)
            .map(line => {
                // Handle deletion commands like /^porn/Id or / porn/Id
                if (line.startsWith('/')) {
                    const match = line.match(/^\/(.+)\/([a-zA-Z]*)$/);
                    if (!match) return null;
                    return {
                        type: 'delete',
                        regex: new RegExp(match[1], match[2])
                    };
                }

                // Handle substitution commands like s,pattern,replacement,g
                const delim = line[1];
                const parts = line.split(delim);
                if (parts.length < 4) return null;

                const pattern = parts[1];
                const replacement = parts[2].replace(/\\(\d+)/g, '$$$1');
                const flags = parts[3] || '';

                return {
                    type: 'substitute',
                    regex: new RegExp(pattern, flags),
                    replacement: replacement
                };
            })
            .filter(Boolean);
    }

    const compiledRules = compileSedRules(sedRules);

    function applySedToText(text) {
        let result = text;
        for (const rule of compiledRules) {
            if (rule.type === 'delete') {
                if (rule.regex.test(result)) return null; // Flag line for deletion
            } else if (rule.type === 'substitute') {
                result = result.replace(rule.regex, rule.replacement);
            }
        }
        return result;
    }

        const lineListDiv = document.getElementById('lineList');
        const lines = rawText.split(/\r?\n/);

        lineListDiv.innerHTML = '';

        lines.forEach(line => {
            if (line.trim() === "") return;

            let textPart = line.trim();
            let urlPart = "";
            const urlMatch = textPart.match(/(\s+https?:\/\/\S+)$/i);
            if (urlMatch) {
                urlPart = urlMatch[1];
                textPart = textPart.slice(0, -urlPart.length);
            }

            // 1. Run through sed rules (returns null if matched by a deletion filter)
            let taggedText = applySedToText(textPart);
            if (taggedText === null) return; 

            // 2. Run NLP for person names
            let doc = nlp(textPart);
            let people = doc.people().out('array');

            let personHashtags = people.map(name => {
                let cleanName = name.replace(/[^a-zA-Z0-9]/g, '');
                return cleanName ? `<span class="hashtag">#${cleanName}</span>` : '';
            }).filter(Boolean).join(' ');

            if (taggedText !== textPart || personHashtags.length > 0) {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `${personHashtags} <span class="modified-line">${taggedText}${urlPart}</span>`;
                lineListDiv.appendChild(div);
            }
        });
    }

    function clearAll() {
        document.getElementById('newsInput').value = '';
        document.getElementById('lineList').innerHTML = '';
    }
</script>
</body>
</html>
